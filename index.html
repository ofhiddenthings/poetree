<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poem tree</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div class="map"><div class="canvas" id="canvas"><svg id="svg" aria-hidden="true"></svg></div></div>
<p class="note" id="note" style="padding:0 32px 32px"></p>

<script src="config.js"></script>
<script src="data.js?v=6"></script>
<script>
const S = 160, GX = 24, GY = 56, NS = "http://www.w3.org/2000/svg";
const canvas = document.getElementById("canvas"), svg = document.getElementById("svg");
let lastSig = null;

/* Show only whole lines: the poem text is cut at the last line that fully fits. */
function fitBoxes() {
  document.querySelectorAll(".box p").forEach(p => {
    const box = p.parentElement;
    const probe = document.createElement("div"); probe.textContent = "x";
    p.appendChild(probe);
    const lh = probe.getBoundingClientRect().height;
    p.removeChild(probe);
    if (!lh) return;
    const room = box.clientHeight - parseFloat(getComputedStyle(box).paddingBottom) - p.offsetTop;
    p.style.maxHeight = Math.max(1, Math.floor(room / lh)) * lh - 1 + "px";
  });
}

function draw(data) {
  if (data.sig === lastSig || !data.list.length) return;
  lastSig = data.sig;
  const list = data.list;
  document.getElementById("note").textContent =
    data.sample ? "Showing sample poems. Connect your sheet in config.js." : "";

  canvas.querySelectorAll(".box").forEach(b => b.remove());
  svg.replaceChildren();

  let leaf = 0;
  function lay(p, d) {
    p.y = d * (S + GY);
    if (!p.kids.length) p.x = leaf++ * (S + GX);
    else { p.kids.forEach(k => lay(k, d + 1)); p.x = (p.kids[0].x + p.kids[p.kids.length - 1].x) / 2; }
  }
  list.filter(p => !p.parentPoem).forEach(r => lay(r, 0));

  const cw = Math.max(1, leaf) * (S + GX) - GX, ch = Math.max(...list.map(p => p.y)) + S;
  canvas.style.width = cw + "px"; canvas.style.height = ch + "px";
  svg.setAttribute("width", cw); svg.setAttribute("height", ch);

  list.forEach(p => {
    const a = document.createElement("a");
    a.className = "box";
    a.href = "poem.html?id=" + encodeURIComponent(p.id);
    a.style.cssText = `left:${p.x}px;top:${p.y}px;width:${S}px;height:${S}px`;
    const b = document.createElement("b"); b.textContent = p.title;
    const t = document.createElement("p");
    p.poem.split(/\r?\n/).forEach(line => {
      const d = document.createElement("div"); d.textContent = line || "\u00a0";
      d.style.cssText = "padding-left:1em;text-indent:-1em"; t.appendChild(d);
    });
    a.append(b, t); canvas.appendChild(a);

    p.kids.forEach(k => {
      const x1 = p.x + S / 2, y1 = p.y + S, x2 = k.x + S / 2, y2 = k.y - 1;
      const yEnd = y2 - 8, ym = (y1 + yEnd) / 2, dx = x2 - x1, sg = Math.sign(dx);
      const r = Math.min(24, Math.abs(dx) / 2, (yEnd - y1) / 2);
      const path = document.createElementNS(NS, "path");
      path.setAttribute("d", dx === 0
        ? `M${x1} ${y1}V${yEnd}`
        : `M${x1} ${y1}V${ym - r}Q${x1} ${ym} ${x1 + sg * r} ${ym}H${x2 - sg * r}Q${x2} ${ym} ${x2} ${ym + r}V${yEnd}`);
      const h = document.createElementNS(NS, "polygon");
      h.setAttribute("points", `${x2},${y2} ${x2 - 4},${y2 - 8} ${x2 + 4},${y2 - 8}`);
      svg.append(path, h);
    });
  });
  fitBoxes();
}

loadPoems(draw);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBoxes);
</script>
</body>
</html>
